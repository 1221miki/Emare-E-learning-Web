<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us — Bento Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d0b14] min-h-screen">

    <!-- ═══════════ About Us — Bento Photo Gallery ═══════════ -->
    <section id="about" class="w-full max-w-7xl mx-auto px-4 sm:px-6 py-16">

        <div class="flex flex-col gap-4">

            <!-- ── Top Section ──────────────────────────────── -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">

                <!-- Top Left — Large Hero Card -->
                <div class="lg:col-span-3 rounded-3xl overflow-hidden group">
                    <img
                        src="https://res.cloudinary.com/afthor2f/image/upload/v1787426018/1.jpg"
                        alt="Team moment"
                        loading="lazy"
                        class="w-full h-72 sm:h-full lg:min-h-[520px] object-cover transition-transform duration-500 group-hover:scale-105"
                    >
                </div>

                <!-- Top Center — 2x2 Sub-Grid -->
                <div class="sm:col-span-2 lg:col-span-3 grid grid-cols-2 gap-4">
                    <div class="rounded-2xl overflow-hidden group">
                        <img
                            src="https://res.cloudinary.com/afthor2f/image/upload/v1787426029/2.jpg"
                            alt="Gallery photo 2"
                            loading="lazy"
                            class="w-full h-40 sm:h-full lg:min-h-[252px] object-cover transition-transform duration-500 group-hover:scale-105"
                        >
                    </div>
                    <div class="rounded-2xl overflow-hidden group">
                        <img
                            src="https://res.cloudinary.com/afthor2f/image/upload/v1787426042/3.jpg"
                            alt="Gallery photo 3"
                            loading="lazy"
                            class="w-full h-40 sm:h-full lg:min-h-[252px] object-cover transition-transform duration-500 group-hover:scale-105"
                        >
                    </div>
                    <div class="rounded-2xl overflow-hidden group">
                        <img
                            src="https://res.cloudinary.com/afthor2f/image/upload/v1787426053/4.jpg"
                            alt="Gallery photo 4"
                            loading="lazy"
                            class="w-full h-40 sm:h-full lg:min-h-[252px] object-cover transition-transform duration-500 group-hover:scale-105"
                        >
                    </div>
                    <div class="rounded-2xl overflow-hidden group">
                        <img
                            src="https://res.cloudinary.com/afthor2f/image/upload/v1787426062/5.jpg"
                            alt="Gallery photo 5"
                            loading="lazy"
                            class="w-full h-40 sm:h-full lg:min-h-[252px] object-cover transition-transform duration-500 group-hover:scale-105"
                        >
                    </div>
                </div>

                <!-- Top Right — Tall Portrait Card -->
                <div class="rounded-3xl overflow-hidden group">
                    <img
                        src="https://res.cloudinary.com/afthor2f/image/upload/v1787426074/6.jpg"
                        alt="Portrait"
                        loading="lazy"
                        class="w-full h-72 sm:h-full lg:min-h-[520px] object-cover transition-transform duration-500 group-hover:scale-105"
                    >
                </div>
            </div>

            <!-- ── Bottom Row — Two Wide Cards ──────────────── -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="rounded-3xl overflow-hidden group">
                    <img
                        src="https://res.cloudinary.com/afthor2f/image/upload/v1787426018/1.jpg"
                        alt="Wide shot one"
                        loading="lazy"
                        class="w-full h-56 md:h-72 object-cover transition-transform duration-500 group-hover:scale-105"
                    >
                </div>
                <div class="rounded-3xl overflow-hidden group">
                    <img
                        src="https://res.cloudinary.com/afthor2f/image/upload/v1787426074/6.jpg"
                        alt="Wide shot two"
                        loading="lazy"
                        class="w-full h-56 md:h-72 object-cover transition-transform duration-500 group-hover:scale-105"
                    >
                </div>
            </div>

        </div>
    </section>

</body>
</html>
