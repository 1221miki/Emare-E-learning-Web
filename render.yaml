services:
  - type: web
    name: emare-elms-backend
    env: node
    region: oregon
    # Build: install backend deps + build the React frontend
    buildCommand: npm install && cd ../client && npm install && npm run build
    startCommand: node server.js
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 120m
      - key: FRONTEND_URL
        value: https://ayires.onrender.com
      - key: APP_BASE_URL
        value: https://ayires.onrender.com
      # NOTE: VITE_API_URL is intentionally NOT set here.
      # The frontend uses relative /api paths in production (same-origin).
