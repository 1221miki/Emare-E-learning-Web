services:
  - type: web
    name: emare-elms-backend
    env: node
    region: oregon
    # Build from repo root — installs deps for both backend and client, then builds the SPA
    buildCommand: npm install && npm --prefix backend install && npm --prefix client install && npm --prefix client run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 120m
      - key: FRONTEND_URL
        value: https://asamenew.onrender.com
      - key: APP_BASE_URL
        value: https://asamenew.onrender.com
