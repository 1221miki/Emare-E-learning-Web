services:
  - type: web
    name: emare-elms-backend
    env: node
    region: oregon
    # rootDir is the repo root so both backend/ and client/ are accessible
    # Build: install all dependencies and build the React SPA
    buildCommand: cd backend && npm install && cd ../client && npm install && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 120m
      - key: FRONTEND_URL
        value: https://ayires.onrender.com
      - key: APP_BASE_URL
        value: https://ayires.onrender.com
      # VITE_API_URL is intentionally NOT set — frontend uses relative /api paths in production
